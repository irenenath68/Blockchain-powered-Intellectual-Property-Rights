name: CI

on: [push]

jobs:
  tests:
    name: "Charity Donation Tracker – Syntax & Deployment Plan Check"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Validate Clarinet contracts and deployment plan"
        uses: docker://hirosystems/clarinet:latest
        with:
          args: check --plan deployments/default.simnet-plan.yaml
on: [push]
jobs:
  tests:
    name: "PROJECT_NAME"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v3
      - name: "Check contract syntax"
        uses: docker://hirosystems/clarinet:latest
        with:
          args: check